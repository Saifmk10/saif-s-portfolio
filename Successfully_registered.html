<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Successfully Registered</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            orange: {
              brand: '#FF5C1A',
            }
          },
          fontFamily: {
            mono: ['Space Mono', 'monospace'],
            sans: ['Syne', 'sans-serif'],
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(24px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            pop: {
              '0%': { transform: 'scale(0.7)', opacity: '0' },
              '70%': { transform: 'scale(1.1)' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            pulse2: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.4' },
            }
          },
          animation: {
            fadeUp: 'fadeUp 0.6s ease forwards',
            fadeUp2: 'fadeUp 0.6s ease 0.15s forwards',
            fadeUp3: 'fadeUp 0.6s ease 0.3s forwards',
            fadeUp4: 'fadeUp 0.6s ease 0.45s forwards',
            pop: 'pop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            pulse2: 'pulse2 2s ease-in-out infinite',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #d1d5db; }
    .card-shadow { box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    .opacity-anim { opacity: 0; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-4" style="background-color: #d4d4d4;">

  <!-- Top bar (mirrors "WROKING ON IT" bar) -->
  <div class="w-full max-w-2xl mb-4 opacity-anim animate-fadeUp">
    <div class="bg-black rounded-2xl flex items-center justify-center py-3 px-6 gap-3">
      <span class="w-3 h-3 rounded-full animate-pulse2" style="background-color:#FF5C1A;"></span>
      <span class="font-mono font-bold tracking-widest text-sm" style="color:#FF5C1A;">YOU'RE IN</span>
    </div>
  </div>

  <!-- Main success card -->
  <div class="w-full max-w-2xl opacity-anim animate-fadeUp2" style="opacity:0;">
    <div class="rounded-2xl card-shadow flex flex-col items-center justify-center py-12 px-8 text-center" style="background-color:#FF5C1A;">

      <!-- Checkmark icon -->
      <div class="mb-6 opacity-anim animate-pop" style="opacity:0;">
        <div class="w-16 h-16 rounded-full bg-black flex items-center justify-center mx-auto">
          <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="#FF5C1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </div>
      </div>

      <h1 class="font-mono font-bold text-2xl md:text-3xl tracking-tight text-black mb-3">
        SUCCESSFULLY REGISTERED!
      </h1>
      <p class="font-sans text-black text-opacity-80 text-base md:text-lg max-w-md" style="color: rgba(0,0,0,0.75);">
        You're on the list. We'll shoot you an email the moment the first article drops.
      </p>
    </div>
  </div>

  <!-- Sub-message -->
  <div class="mt-6 text-center opacity-anim animate-fadeUp3" style="opacity:0;">
    <p class="font-sans text-sm text-gray-500">
      Keep an eye on your inbox — good things are coming.
    </p>
  </div>

  <!-- Back button -->
  <div class="mt-6 opacity-anim animate-fadeUp4" style="opacity:0;">
    <a
      href="./index.html"
      class="inline-block font-mono font-bold text-sm tracking-widest px-8 py-3 rounded-xl transition-all duration-200 hover:opacity-90 active:scale-95"
      style="background-color:#FF5C1A; color:#000;"
    >
      BACK TO HOME
    </a>
  </div>

</body>
</html>
